[package]
name = "quench-agent"
version = "0.1.0"
edition = "2021"
description = "Quench native local optimization agent (Linux x86_64)"
publish = false

[[bin]]
name = "quench-agent"
path = "src/main.rs"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = false
codegen-units = 4
